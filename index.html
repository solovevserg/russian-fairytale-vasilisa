<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Интерактивная 3D-история по сказке «Василиса Прекрасная»" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // тема до первой отрисовки, чтобы не мигала светлая страница (см. src/ui/theme.ts)
      try {
        const saved = localStorage.getItem("izbushka:theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <title>Избушка на курьих ножках</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
